name: release-please

# Runs on every push to main.
#
# Opens (or updates) a single "release PR" that accumulates Conventional
# Commit messages since the last tag and computes the next semver. On merge,
# release-please:
#   1. Writes CHANGELOG.md
#   2. Bumps VERSION, typescript/**/package.json, jsr.json, licensing/version.go
#      (see release-please-config.json → extra-files)
#   3. Creates a GitHub Release + pushes the tag vX.Y.Z
#
# The tag push triggers `.github/workflows/release.yml`, which publishes to
# npm, jsr, and warms proxy.golang.org.
#
# See docs/versioning.md for the full flow and RELEASING.md for the manual
# fallback when release-please is bypassed.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps VERSION but does not own the seven derived
      # manifests — scripts/sync-versions.mjs does, and nothing may write a
      # file twice. Left alone, a release PR would carry a bumped VERSION
      # with stale manifests and fail its own version:check gate in ts.yml.
      # Syncing here means the PR arrives green and a maintainer merges one
      # coherent commit.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.pr }}
        with:
          bun-version: 1.3.12

      - name: Sync derived manifests into the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

          bun install --frozen-lockfile
          bun run version:sync

          if git diff --quiet; then
            echo "Manifests already match VERSION; nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync derived manifests to VERSION"
          git push origin "$PR_BRANCH"

  # After release-please cuts a release (PR merged → tag pushed),
  # sanity-check that every derived manifest agrees with VERSION.
  #
  # release-please owns VERSION, CHANGELOG.md, and its own manifest;
  # scripts/sync-versions.mjs owns the seven derived manifests. Nothing is
  # written by both — that overlap is what previously let the two fight.
  # This step catches the remaining failure mode: a release PR that bumps
  # VERSION without version:sync having been run against it.
  verify-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Version drift check
        run: |
          echo "Release created: ${{ needs.release-please.outputs.tag_name }}"
          bun run version:check
