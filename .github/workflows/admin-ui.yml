name: admin-ui

on:
  push:
    branches: [ main ]
    paths:
      - 'admin/**'
      - 'openapi/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/admin-ui.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'openapi/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/admin-ui.yml'

concurrency:
  group: admin-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: biome + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install workspace deps
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Biome check (admin scope)
        working-directory: .
        run: bunx biome check admin

      - name: Typecheck
        # nuxt-open-fetch regenerates the typed client into .nuxt/ during
        # `nuxt prepare` (which postinstall already ran). Drift is
        # impossible because the spec at openapi/licensing-admin.yaml is
        # the only source — if it changes, this step re-reads it.
        run: bun run typecheck

      - name: Build (Nuxt)
        run: bun run build

  smoke:
    name: browser smoke (non-blocking)
    runs-on: ubuntu-latest
    # Advisory only. bunwright is pre-1.0 and documents no fixtures,
    # parallel workers, or trace viewer, so a tooling defect must not block
    # unrelated work. The result still shows on the PR for triage.
    #
    # Promote to blocking (delete this line) once BOTH hold:
    #   1. 20 consecutive green runs on main with no flake-driven reruns.
    #   2. bunwright reaches 1.0, or its selector/waiting API stops
    #      changing across a minor release.
    continue-on-error: true
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install workspace deps
        working-directory: .
        run: bun install --frozen-lockfile

      # The suite drives the built output rather than the dev server, so
      # the build has to exist before the tests run.
      - name: Build (Nuxt)
        run: bun run build

      # ubuntu-latest ships Chrome preinstalled; the suite never downloads
      # a browser. If the path moves, the harness fails with a message
      # naming BUN_CHROME_PATH rather than a spawn error.
      - name: Browser smoke checks
        env:
          BUN_CHROME_PATH: /usr/bin/google-chrome
        run: bun run test:smoke
